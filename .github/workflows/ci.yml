name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[all,dev]"
      - run: ruff check .
      - run: python -m pytest

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[all,dev]"
      - id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed=$(git diff --name-only "$PR_BASE" "$PR_HEAD")
          elif [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            changed=$(git show --pretty= --name-only HEAD)
          else
            changed=$(git diff --name-only "$PUSH_BEFORE" "$PUSH_HEAD")
          fi
          if grep -Eq '^(config/prompts/|src/finch_agent/config/prompts/|src/finch_agent/)' <<< "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Initialize evaluation database
        if: steps.changes.outputs.run == 'true'
        run: python scripts/init_sample_db.py
      - name: Run deterministic multi-agent evaluation
        if: steps.changes.outputs.run == 'true'
        run: python scripts/evaluate_golden.py --threshold 0.85
      - name: Add evaluation report to job summary
        if: always() && steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          if [[ -f eval_report.md ]]; then
            cat eval_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Golden evaluation report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi
